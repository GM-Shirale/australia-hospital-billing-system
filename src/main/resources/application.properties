spring.application.name=hospital-billing-system

server.port=8083

# ==============================
# DATABASE (PostgreSQL)
# ==============================
spring.datasource.url=jdbc:postgresql://localhost:5432/SpringBootProject
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / HIBERNATE
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=true


# ==========================================
# FILE UPLOAD
# ==========================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

file.upload-dir=uploads/customer-documents


# ==========================================
# LOGGING
# ==========================================

logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Spring AI OpenAI Configuration
spring.ai.openai.api-key=sk-dummy-key-for-local-boot-1234567890abcdef
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.3